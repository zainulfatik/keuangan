<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOMPETKU - Tenchu Shinobi Treasury & Google Sheets Sync</title>
  
  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS & Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  
  <!-- Fonts & Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Noto+Serif+JP:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tenchu: {
              bg: '#08080a',
              card: '#121217',
              border: '#2a2833',
              crimson: '#8b0000',
              blood: '#dc2626',
              gold: '#d97706',
              goldBright: '#f59e0b',
              paper: '#f3ece0',
              paperDark: '#23211b',
              ink: '#050507'
            }
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            jp: ['"Noto Serif JP"', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #08080a;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(139, 0, 0, 0.18) 0%, transparent 60%),
        radial-gradient(circle at 10% 80%, rgba(217, 119, 6, 0.08) 0%, transparent 40%),
        repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 2px);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #e2e8f0;
    }

    /* Rice paper / Scroll texture overlay */
    .ninja-card {
      background: linear-gradient(145deg, rgba(22, 21, 28, 0.95), rgba(12, 11, 16, 0.98));
      border: 1px solid #2a2736;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      position: relative;
    }

    .ninja-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #8b0000, #d97706, #8b0000, transparent);
      opacity: 0.8;
    }

    .kanji-watermark {
      font-family: 'Noto Serif JP', serif;
      pointer-events: none;
      user-select: none;
      opacity: 0.04;
    }

    .scroll-border {
      border-image: linear-gradient(to bottom, #d97706, #8b0000, #2a2736) 1;
    }

    /* Glow stealth indicator meter */
    .stealth-eye-glow {
      box-shadow: 0 0 20px rgba(220, 38, 38, 0.6);
      animation: pulseGlow 2.5s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px rgba(220, 38, 38, 0.4); }
      100% { box-shadow: 0 0 25px rgba(220, 38, 38, 0.9); }
    }

    .kanji-heading {
      font-family: 'Noto Serif JP', serif;
      letter-spacing: 0.05em;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0d0c10;
    }
    ::-webkit-scrollbar-thumb {
      background: #3e384d;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #8b0000;
    }
  </style>
</head>
<body class="min-h-screen pb-12 selection:bg-red-900 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Web Audio Sound FX for Tenchu Experience
    const playSound = (type) => {
      try {
        if (!window.AudioContext && !window.webkitAudioContext) return;
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        const now = ctx.currentTime;
        if (type === 'slash') { // Katana blade slash for action
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(800, now);
          osc.frequency.exponentialRampToValueAtTime(100, now + 0.15);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        } else if (type === 'scroll') { // Scroll unroll
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, now);
          osc.frequency.linearRampToValueAtTime(600, now + 0.1);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now);
          osc.stop(now + 0.1);
        } else if (type === 'stealth') { // Hide balance / Stealth sight
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(200, now);
          osc.frequency.exponentialRampToValueAtTime(500, now + 0.2);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        }
      } catch (e) {
        // Audio fallback ignore
      }
    };

    function App() {
      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('dompetku_script_url') || '');
      const [showSettings, setShowSettings] = useState(false);
      const [hideBalance, setHideBalance] = useState(true);
      const [isLoading, setIsLoading] = useState(false);
      const [deletingId, setDeletingId] = useState(null);
      const [toast, setToast] = useState(null);

      // Default Wallets (Kantung Ninja)
      const defaultWallets = ["Tas", "Seabank", "Jok", "Lemari", "BNI", "BRI"];

      // Default Transactions
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('dompetku_txs');
        return saved ? JSON.parse(saved) : [
          { id: 'tx_local_1', date: '2026-09-12', type: 'Pemasukan', wallet: 'Tas', category: 'Gaji / Pendapatan', amount: 1000000, notes: 'Modal Perbendaharaan Ninja' },
          { id: 'tx_local_2', date: '2026-09-12', type: 'Pengeluaran', wallet: 'Tas', category: 'Makanan & Minuman', amount: 50000, notes: 'Ransum Misi (Miso & Rice)' }
        ];
      });

      // Filter States
      const [filterWallet, setFilterWallet] = useState('Semua');
      const [filterType, setFilterType] = useState('Semua');
      const [filterMonth, setFilterMonth] = useState('Semua');
      const [searchQuery, setSearchQuery] = useState('');

      // Form Modal State
      const [showAddModal, setShowAddModal] = useState(false);
      const [modalType, setModalType] = useState('Pengeluaran');
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        wallet: 'Tas',
        walletTo: 'Seabank',
        category: 'Makanan & Minuman',
        amount: '',
        notes: ''
      });

      // Chart Ref
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        localStorage.setItem('dompetku_txs', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('dompetku_script_url', scriptUrl);
      }, [scriptUrl]);

      const showNotification = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      const syncFromSheets = async () => {
        playSound('scroll');
        if (!scriptUrl) {
          showNotification('⚠️ Masukkan URL Google Apps Script di menu Pengaturan terlebih dahulu!', 'warning');
          setShowSettings(true);
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch(scriptUrl);
          const data = await res.json();
          if (data.status === 'success' && Array.isArray(data.transactions)) {
            setTransactions(data.transactions);
            showNotification('⚡ Gulungan Perbendaharaan berhasil disinkronkan!', 'success');
          } else {
            showNotification('❌ Gagal membaca data: ' + (data.message || 'Format tidak valid'), 'error');
          }
        } catch (err) {
          showNotification('❌ Terputus dari Google Sheets: ' + err.message, 'error');
        } finally {
          setIsLoading(false);
        }
      };

      const handleDeleteTransaction = async (tx) => {
        playSound('slash');
        if (!confirm(`Apakah Anda yakin ingin menumpas catatan "${tx.notes || tx.category}" (Rp ${Number(tx.amount).toLocaleString('id-ID')})?`)) {
          return;
        }

        const previousTxs = [...transactions];
        setTransactions(prev => prev.filter(t => t.id !== tx.id));
        setDeletingId(tx.id);

        if (!scriptUrl) {
          showNotification('Hapus lokal berhasil. (Tambahkan URL Apps Script untuk Google Sheets)', 'info');
          setDeletingId(null);
          return;
        }

        try {
          showNotification('🗡️ Menumpas catatan di Google Sheets...', 'info');
          
          const payload = JSON.stringify({
            action: 'delete',
            id: tx.id,
            date: tx.date,
            type: tx.type,
            wallet: tx.wallet,
            category: tx.category,
            amount: tx.amount,
            notes: tx.notes
          });

          const response = await fetch(scriptUrl, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: payload
          });

          const result = await response.json();

          if (result.status === 'success') {
            showNotification('🥷 Catatan BERHASIL DITUMPAS dari Google Sheets!', 'success');
          } else {
            setTransactions(previousTxs);
            showNotification('❌ Gagal menumpas di Sheets: ' + result.message, 'error');
          }
        } catch (err) {
          console.error('Delete error:', err);
          try {
            const queryParams = new URLSearchParams({
              action: 'delete',
              date: tx.date || '',
              type: tx.type || '',
              wallet: tx.wallet || '',
              category: tx.category || '',
              amount: tx.amount || 0,
              notes: tx.notes || ''
            }).toString();

            const fallbackRes = await fetch(`${scriptUrl}?${queryParams}`);
            const fallbackData = await fallbackRes.json();

            if (fallbackData.status === 'success') {
              showNotification('🥷 Catatan BERHASIL DITUMPAS dari Google Sheets!', 'success');
            } else {
              setTransactions(previousTxs);
              showNotification('❌ Gagal memangkas data Spreadsheet', 'error');
            }
          } catch (fallbackErr) {
            setTransactions(previousTxs);
            showNotification('❌ Koneksi terblokir. Pastikan Web App diset "Anyone / Siapa Saja"', 'error');
          }
        } finally {
          setDeletingId(null);
        }
      };

      const handleAddSubmit = async (e) => {
        e.preventDefault();
        playSound('slash');

        if (!formData.amount || Number(formData.amount) <= 0) {
          showNotification('⚠️ Masukkan nominal emas/rupiah yang valid!', 'warning');
          return;
        }

        let walletValue = formData.wallet;
        if (modalType === 'Transfer') {
          walletValue = `${formData.wallet} ➔ ${formData.walletTo}`;
        }

        const newTx = {
          id: 'tx_local_' + Date.now(),
          date: formData.date,
          type: modalType,
          wallet: walletValue,
          category: modalType === 'Transfer' ? 'Transfer Saldo' : formData.category,
          amount: Number(formData.amount),
          notes: formData.notes
        };

        setTransactions(prev => [newTx, ...prev]);
        setShowAddModal(false);

        setFormData({
          date: new Date().toISOString().split('T')[0],
          wallet: 'Tas',
          walletTo: 'Seabank',
          category: 'Makanan & Minuman',
          amount: '',
          notes: ''
        });

        if (scriptUrl) {
          try {
            showNotification('📜 Merekam catatan ke Google Sheets...', 'info');
            await fetch(scriptUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'add',
                ...newTx
              })
            });
            showNotification('✅ Catatan tersimpan di Google Sheets!', 'success');
          } catch (err) {
            showNotification('⚠️ Tersimpan lokal, gagal tersambung ke Sheets', 'warning');
          }
        }
      };

      const walletBalances = useMemo(() => {
        const balances = {};
        defaultWallets.forEach(w => balances[w] = 0);

        transactions.forEach(tx => {
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'Pemasukan') {
            if (balances[tx.wallet] !== undefined) balances[tx.wallet] += amt;
            else balances[tx.wallet] = amt;
          } else if (tx.type === 'Pengeluaran') {
            if (balances[tx.wallet] !== undefined) balances[tx.wallet] -= amt;
            else balances[tx.wallet] = -amt;
          } else if (tx.type === 'Transfer' && tx.wallet.includes('➔')) {
            const [fromW, toW] = tx.wallet.split('➔').map(s => s.trim());
            if (balances[fromW] !== undefined) balances[fromW] -= amt;
            if (balances[toW] !== undefined) balances[toW] += amt;
          }
        });
        return balances;
      }, [transactions]);

      const totalMetrics = useMemo(() => {
        let totalInc = 0;
        let totalExp = 0;
        transactions.forEach(tx => {
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'Pemasukan') totalInc += amt;
          if (tx.type === 'Pengeluaran') totalExp += amt;
        });
        const grandTotal = Object.values(walletBalances).reduce((a, b) => a + b, 0);
        return { grandTotal, totalInc, totalExp };
      }, [transactions, walletBalances]);

      const monthlyMetrics = useMemo(() => {
        const monthlyMap = {};
        const monthNames = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

        transactions.forEach(tx => {
          if (!tx.date) return;
          const ym = String(tx.date).substring(0, 7);
          if (!ym || ym.length < 7) return;

          if (!monthlyMap[ym]) {
            monthlyMap[ym] = { income: 0, expense: 0, count: 0 };
          }

          const amt = Number(tx.amount) || 0;
          if (tx.type === 'Pemasukan') {
            monthlyMap[ym].income += amt;
            monthlyMap[ym].count += 1;
          } else if (tx.type === 'Pengeluaran') {
            monthlyMap[ym].expense += amt;
            monthlyMap[ym].count += 1;
          }
        });

        const sortedMonths = Object.keys(monthlyMap).sort().reverse();

        return sortedMonths.map(ym => {
          const [year, monthStr] = ym.split('-');
          const monthIdx = parseInt(monthStr, 10) - 1;
          const label = `${monthNames[monthIdx] || monthStr} ${year}`;
          const inc = monthlyMap[ym].income;
          const exp = monthlyMap[ym].expense;
          return {
            ym,
            label,
            income: inc,
            expense: exp,
            net: inc - exp,
            count: monthlyMap[ym].count
          };
        });
      }, [transactions]);

      const filteredTransactions = useMemo(() => {
        return transactions.filter(tx => {
          const matchWallet = filterWallet === 'Semua' || tx.wallet.includes(filterWallet);
          const matchType = filterType === 'Semua' || tx.type === filterType;
          const matchMonth = filterMonth === 'Semua' || (tx.date && String(tx.date).startsWith(filterMonth));
          const query = searchQuery.toLowerCase();
          const matchSearch = !query || 
            (tx.notes && tx.notes.toLowerCase().includes(query)) ||
            (tx.category && tx.category.toLowerCase().includes(query)) ||
            (tx.wallet && tx.wallet.toLowerCase().includes(query));

          return matchWallet && matchType && matchMonth && matchSearch;
        });
      }, [transactions, filterWallet, filterType, filterMonth, searchQuery]);

      useEffect(() => {
        if (!chartRef.current) return;

        const categoryTotals = {};
        transactions.forEach(tx => {
          if (tx.type === 'Pengeluaran') {
            const cat = tx.category || 'Lainnya';
            categoryTotals[cat] = (categoryTotals[cat] || 0) + Number(tx.amount);
          }
        });

        const labels = Object.keys(categoryTotals);
        const data = Object.values(categoryTotals);

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels.length ? labels : ['Belum Ada Misi Pengeluaran'],
            datasets: [{
              data: data.length ? data : [1],
              backgroundColor: data.length ? [
                '#dc2626', '#d97706', '#f59e0b', '#84cc16', '#10b981', '#06b6d4', '#6366f1', '#a855f7'
              ] : ['#2a2736'],
              borderColor: '#121217',
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { 
                position: 'bottom',
                labels: { color: '#94a3b8', font: { family: 'Plus Jakarta Sans', size: 11 } }
              }
            }
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [transactions]);

      return (
        <div className="max-w-7xl mx-auto px-4 py-6 relative overflow-hidden">
          
          {/* Subtle Background Kanji Watermark */}
          <div className="absolute top-10 right-10 text-[180px] font-black kanji-watermark text-red-900 leading-none">
            天誅
          </div>
          <div className="absolute bottom-20 left-10 text-[160px] font-black kanji-watermark text-amber-900 leading-none">
            忍
          </div>

          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-lg shadow-2xl text-white font-semibold flex items-center space-x-3 border ${
              toast.type === 'error' ? 'bg-red-950/90 border-red-600 text-red-200' :
              toast.type === 'warning' ? 'bg-amber-950/90 border-amber-600 text-amber-200' :
              toast.type === 'success' ? 'bg-emerald-950/90 border-emerald-600 text-emerald-200' : 'bg-slate-900 border-slate-700'
            }`}>
              <i className="fa-solid fa-shuriken text-amber-500 animate-spin"></i>
              <span className="text-sm">{toast.msg}</span>
            </div>
          )}

          {/* Tenchu Ninja Header */}
          <header className="ninja-card rounded-2xl p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4 relative overflow-hidden border-b-2 border-red-900">
            <div className="flex items-center space-x-4">
              <div className="w-14 h-14 bg-gradient-to-br from-red-900 to-black rounded-xl border border-red-600 flex items-center justify-center text-red-500 shadow-lg relative group">
                <span className="text-2xl font-black kanji-heading text-red-500 group-hover:scale-110 transition">誅</span>
                <span className="absolute -top-1 -right-1 w-3 h-3 bg-red-600 rounded-full animate-ping"></span>
              </div>
              <div>
                <div className="flex items-center space-x-2">
                  <h1 className="text-2xl md:text-3xl font-black tracking-wider text-white font-cinzel">
                    DOMPET<span className="text-red-600">KU</span>
                  </h1>
                  <span className="bg-red-900/60 text-red-300 border border-red-700/60 px-2 py-0.5 rounded text-[10px] uppercase font-mono tracking-widest">
                    TENCHU SHINOBI EDITION
                  </span>
                </div>
                <p className="text-xs text-slate-400 mt-0.5 font-jp">
                  天誅 財宝の巻 — Multi-Device Treasury &amp; Google Sheets Stealth Sync
                </p>
              </div>
            </div>

            {/* Header Action Buttons */}
            <div className="flex flex-wrap items-center gap-3">
              <button 
                onClick={syncFromSheets}
                disabled={isLoading}
                className="bg-gradient-to-r from-red-900 via-red-950 to-black hover:from-red-800 hover:to-red-900 text-amber-400 border border-red-700/80 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center space-x-2 transition shadow-md disabled:opacity-50"
              >
                <i className={`fa-solid fa-rotate ${isLoading ? 'animate-spin text-red-400' : 'text-amber-500'}`}></i>
                <span>{isLoading ? 'Menyinkronkan...' : 'Sinkron Sheets'}</span>
              </button>

              <button 
                onClick={() => {
                  playSound('stealth');
                  setHideBalance(!hideBalance);
                }}
                className={`px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition border flex items-center space-x-2 ${
                  hideBalance 
                    ? 'bg-slate-900/80 border-slate-700 text-slate-300 hover:border-slate-500' 
                    : 'bg-red-950/60 border-red-600 text-red-400 stealth-eye-glow'
                }`}
              >
                <i className={`fa-solid ${hideBalance ? 'fa-eye-slash text-slate-400' : 'fa-eye text-red-500'}`}></i>
                <span>{hideBalance ? 'Mode Stealth' : 'Buka Saldo'}</span>
              </button>

              <button 
                onClick={() => {
                  playSound('scroll');
                  setShowSettings(true);
                }}
                className="bg-slate-900/80 border border-slate-700 hover:border-amber-500 text-amber-400 p-2.5 rounded-xl text-xs transition"
                title="Pengaturan Google Apps Script"
              >
                <i className="fa-solid fa-gear text-base"></i>
              </button>
            </div>
          </header>

          {/* Grand Treasury Overview Cards */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            
            {/* Grand Total */}
            <div className="ninja-card p-5 rounded-2xl border-l-4 border-l-amber-500 flex items-center justify-between">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="text-[10px] uppercase font-bold tracking-widest text-amber-400 font-cinzel">Total Perbendaharaan</span>
                  <span className="text-xs text-amber-600 font-jp">総資産</span>
                </div>
                <div className="text-2xl sm:text-3xl font-black mt-1 text-white font-cinzel tracking-tight">
                  {hideBalance ? 'Rp •••••••••' : `Rp ${totalMetrics.grandTotal.toLocaleString('id-ID')}`}
                </div>
                <span className="text-[11px] text-slate-500 mt-1 block">Gabungan dari seluruh kantung ninja</span>
              </div>
              <div className="w-12 h-12 bg-amber-950/40 text-amber-400 rounded-xl flex items-center justify-center text-2xl border border-amber-600/30">
                <i className="fa-solid fa-vault"></i>
              </div>
            </div>

            {/* Total Income */}
            <div className="ninja-card p-5 rounded-2xl border-l-4 border-l-emerald-500 flex items-center justify-between">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="text-[10px] uppercase font-bold tracking-widest text-emerald-400 font-cinzel">Hasil Misi / Pemasukan</span>
                  <span className="text-xs text-emerald-600 font-jp">報酬</span>
                </div>
                <div className="text-xl font-extrabold text-white mt-1 font-cinzel">
                  {hideBalance ? 'Rp •••••••••' : `Rp ${totalMetrics.totalInc.toLocaleString('id-ID')}`}
                </div>
                <span className="text-[11px] text-slate-500 mt-1 block">Akumulasi pendapatan bounty</span>
              </div>
              <div className="w-11 h-11 bg-emerald-950/40 text-emerald-400 rounded-xl flex items-center justify-center text-xl border border-emerald-600/30">
                <i className="fa-solid fa-scroll"></i>
              </div>
            </div>

            {/* Total Expense */}
            <div className="ninja-card p-5 rounded-2xl border-l-4 border-l-red-600 flex items-center justify-between">
              <div>
                <div className="flex items-center space-x-2">
                  <span className="text-[10px] uppercase font-bold tracking-widest text-red-400 font-cinzel">Biaya Operasi / Pengeluaran</span>
                  <span className="text-xs text-red-600 font-jp">消費</span>
                </div>
                <div className="text-xl font-extrabold text-white mt-1 font-cinzel">
                  {hideBalance ? 'Rp •••••••••' : `Rp ${totalMetrics.totalExp.toLocaleString('id-ID')}`}
                </div>
                <span className="text-[11px] text-slate-500 mt-1 block">Akumulasi perlengkapan &amp; ransum</span>
              </div>
              <div className="w-11 h-11 bg-red-950/40 text-red-400 rounded-xl flex items-center justify-center text-xl border border-red-600/30">
                <i className="fa-solid fa-ninja"></i>
              </div>
            </div>
          </div>

          {/* Section Title */}
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-xs font-bold uppercase tracking-widest text-amber-500 flex items-center gap-2 font-cinzel">
              <i className="fa-solid fa-pouch-tobacco"></i>
              <span>Kantung Perbendaharaan Ninja</span>
            </h3>
            <span className="text-xs text-slate-500 font-jp">{defaultWallets.length} Posisi Dompet</span>
          </div>

          {/* Wallet Balance Cards */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
            {defaultWallets.map((w, idx) => {
              const bal = walletBalances[w] || 0;
              return (
                <div 
                  key={w} 
                  className="bg-slate-950/80 border border-slate-800 hover:border-amber-600/60 p-4 rounded-xl shadow-lg transition flex flex-col justify-between group relative overflow-hidden"
                >
                  <div className="flex justify-between items-center text-slate-400 text-xs">
                    <span className="text-[10px] uppercase tracking-wider text-slate-500">Saldo</span>
                    <i className="fa-solid fa-sack-dollar text-amber-600/60 group-hover:text-amber-400 transition"></i>
                  </div>
                  <div className="mt-2">
                    <div className="text-xs font-bold text-amber-400 tracking-wide font-cinzel">{w}</div>
                    <div className="text-base font-extrabold text-white truncate font-mono mt-0.5">
                      {hideBalance ? 'Rp •••••' : `Rp ${bal.toLocaleString('id-ID')}`}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Monthly Financial History Summary Section */}
          <div className="ninja-card rounded-2xl p-5 mb-6 border border-slate-800">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4">
              <div>
                <h3 className="text-base font-bold text-white flex items-center space-x-2 font-cinzel">
                  <i className="fa-solid fa-book-bookmark text-amber-500"></i>
                  <span>Gulungan Riwayat Bulanan</span>
                  <span className="text-xs font-jp text-amber-600 font-normal"> 月次記録</span>
                </h3>
                <p className="text-xs text-slate-400">Ringkasan total perolehan dan pengeluaran per periode bulan</p>
              </div>
              <span className="text-xs bg-red-950 border border-red-800 text-red-300 px-3 py-1 rounded-full font-mono">
                {monthlyMetrics.length} Periode
              </span>
            </div>

            {monthlyMetrics.length === 0 ? (
              <p className="text-xs text-slate-500 text-center py-4 font-jp">Belum ada gulungan data bulanan.</p>
            ) : (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                {monthlyMetrics.map(m => (
                  <div key={m.ym} className="bg-slate-950/60 rounded-xl p-4 border border-slate-800/80 hover:border-slate-700 transition">
                    <div className="flex justify-between items-center pb-2 border-b border-slate-800 mb-3">
                      <span className="font-bold text-amber-400 text-sm font-cinzel">{m.label}</span>
                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded border uppercase tracking-wider ${
                        m.net >= 0 ? 'bg-emerald-950/80 border-emerald-700 text-emerald-400' : 'bg-red-950/80 border-red-700 text-red-400'
                      }`}>
                        {m.net >= 0 ? 'Surplus' : 'Defisit'}
                      </span>
                    </div>

                    <div className="space-y-2 text-xs">
                      <div className="flex justify-between items-center">
                        <span className="text-slate-400 flex items-center">
                          <i className="fa-solid fa-arrow-down text-emerald-500 mr-1.5"></i>
                          Hasil Misi
                        </span>
                        <span className="font-bold text-emerald-400 font-mono">
                          {hideBalance ? 'Rp •••••••' : `+ Rp ${m.income.toLocaleString('id-ID')}`}
                        </span>
                      </div>

                      <div className="flex justify-between items-center">
                        <span className="text-slate-400 flex items-center">
                          <i className="fa-solid fa-arrow-up text-red-500 mr-1.5"></i>
                          Biaya Misi
                        </span>
                        <span className="font-bold text-red-400 font-mono">
                          {hideBalance ? 'Rp •••••••' : `- Rp ${m.expense.toLocaleString('id-ID')}`}
                        </span>
                      </div>

                      <div className="pt-2 border-t border-slate-800/80 flex justify-between items-center font-semibold text-slate-300">
                        <span className="font-cinzel text-[11px]">Net Cashflow</span>
                        <span className={`font-mono ${m.net >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                          {hideBalance ? 'Rp •••••••' : `${m.net >= 0 ? '+' : ''} Rp ${m.net.toLocaleString('id-ID')}`}
                        </span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Main Content Grid */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* Left Column: Transaction List */}
            <div className="lg:col-span-2 ninja-card rounded-2xl p-5 border border-slate-800">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-5">
                <div>
                  <h2 className="text-lg font-bold text-white font-cinzel flex items-center gap-2">
                    <span>Catatan Transaksi</span>
                    <span className="text-xs bg-red-950 text-red-300 border border-red-800 px-2.5 py-0.5 rounded-full font-mono font-normal">
                      {filteredTransactions.length} Log
                    </span>
                  </h2>
                </div>

                {/* Add Transaction Buttons */}
                <div className="flex flex-wrap gap-2">
                  <button 
                    onClick={() => { playSound('scroll'); setModalType('Pengeluaran'); setShowAddModal(true); }}
                    className="bg-gradient-to-r from-red-900 to-red-950 hover:from-red-800 hover:to-red-900 text-red-200 border border-red-700 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow"
                  >
                    <i className="fa-solid fa-minus-circle"></i>
                    <span>Pengeluaran</span>
                  </button>

                  <button 
                    onClick={() => { playSound('scroll'); setModalType('Pemasukan'); setShowAddModal(true); }}
                    className="bg-gradient-to-r from-emerald-900 to-emerald-950 hover:from-emerald-800 hover:to-emerald-900 text-emerald-200 border border-emerald-700 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow"
                  >
                    <i className="fa-solid fa-plus-circle"></i>
                    <span>Pemasukan</span>
                  </button>

                  <button 
                    onClick={() => { playSound('scroll'); setModalType('Transfer'); setShowAddModal(true); }}
                    className="bg-gradient-to-r from-amber-900 to-amber-950 hover:from-amber-800 hover:to-amber-900 text-amber-200 border border-amber-700 px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 shadow"
                  >
                    <i className="fa-solid fa-arrow-right-arrow-left"></i>
                    <span>Transfer</span>
                  </button>
                </div>
              </div>

              {/* Filter Controls */}
              <div className="grid grid-cols-1 sm:grid-cols-4 gap-2 mb-4">
                <select 
                  value={filterMonth} 
                  onChange={(e) => setFilterMonth(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-amber-500"
                >
                  <option value="Semua">Semua Bulan</option>
                  {monthlyMetrics.map(m => <option key={m.ym} value={m.ym}>{m.label}</option>)}
                </select>

                <select 
                  value={filterWallet} 
                  onChange={(e) => setFilterWallet(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-amber-500"
                >
                  <option value="Semua">Semua Kantung</option>
                  {defaultWallets.map(w => <option key={w} value={w}>{w}</option>)}
                </select>

                <select 
                  value={filterType} 
                  onChange={(e) => setFilterType(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-amber-500"
                >
                  <option value="Semua">Semua Jenis</option>
                  <option value="Pemasukan">Pemasukan</option>
                  <option value="Pengeluaran">Pengeluaran</option>
                  <option value="Transfer">Transfer</option>
                </select>

                <input 
                  type="text"
                  placeholder="Cari..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-amber-500"
                />
              </div>

              {/* Transactions Table */}
              <div className="overflow-x-auto rounded-xl border border-slate-800/80 bg-slate-950/40">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-900/90 text-slate-400 font-cinzel text-[11px] uppercase tracking-wider border-b border-slate-800">
                    <tr>
                      <th className="p-3">Tanggal</th>
                      <th className="p-3">Tipe</th>
                      <th className="p-3">Kantung</th>
                      <th className="p-3">Kategori &amp; Keterangan</th>
                      <th className="p-3 text-right">Jumlah</th>
                      <th className="p-3 text-center">Tumpas</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60">
                    {filteredTransactions.length === 0 ? (
                      <tr>
                        <td colSpan="6" className="text-center py-10 text-slate-500">
                          <i className="fa-solid fa-torii-gate text-3xl mb-2 block text-slate-700"></i>
                          Tidak ada catatan transaksi ditemukan.
                        </td>
                      </tr>
                    ) : (
                      filteredTransactions.map((tx) => (
                        <tr key={tx.id} className="hover:bg-slate-900/60 transition group">
                          <td className="p-3 font-mono text-xs text-slate-400 whitespace-nowrap">{tx.date}</td>
                          <td className="p-3">
                            <span className={`inline-block px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wider border ${
                              tx.type === 'Pemasukan' ? 'bg-emerald-950/80 border-emerald-700 text-emerald-400' :
                              tx.type === 'Pengeluaran' ? 'bg-red-950/80 border-red-700 text-red-400' :
                              'bg-amber-950/80 border-amber-700 text-amber-400'
                            }`}>
                              {tx.type}
                            </span>
                          </td>
                          <td className="p-3 font-medium text-slate-300 text-xs font-cinzel">{tx.wallet}</td>
                          <td className="p-3">
                            <div className="font-medium text-slate-200 text-xs">{tx.category || '-'}</div>
                            {tx.notes && <div className="text-[11px] text-slate-500 font-jp">{tx.notes}</div>}
                          </td>
                          <td className={`p-3 text-right font-bold font-mono text-xs whitespace-nowrap ${
                            tx.type === 'Pemasukan' ? 'text-emerald-400' :
                            tx.type === 'Pengeluaran' ? 'text-red-400' :
                            'text-amber-400'
                          }`}>
                            {tx.type === 'Pemasukan' ? '+ ' : tx.type === 'Pengeluaran' ? '- ' : ''}
                            Rp {Number(tx.amount).toLocaleString('id-ID')}
                          </td>
                          <td className="p-3 text-center">
                            <button 
                              onClick={() => handleDeleteTransaction(tx)}
                              disabled={deletingId === tx.id}
                              className="text-slate-600 hover:text-red-500 p-1.5 rounded transition disabled:opacity-30"
                              title="Tumpas Catatan (Hapus dari Google Sheets)"
                            >
                              <i className={`fa-solid ${deletingId === tx.id ? 'fa-spinner animate-spin text-red-500' : 'fa-skull'}`}></i>
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Right Column: Analytics & Info */}
            <div className="ninja-card rounded-2xl p-5 border border-slate-800 flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-white font-cinzel">Pengeluaran Per Kategori</h3>
                  <span className="text-xs text-amber-500 font-jp">分析</span>
                </div>
                <div className="relative h-64 w-full">
                  <canvas ref={chartRef}></canvas>
                </div>
              </div>

              <div className="mt-6 p-4 bg-red-950/30 rounded-xl border border-red-900/40 text-xs text-slate-300 space-y-1.5">
                <div className="font-bold text-red-400 font-cinzel flex items-center gap-1.5">
                  <i className="fa-solid fa-shield-halved"></i>
                  <span>Proteksi Stealth Sync:</span>
                </div>
                <p className="text-[11px] text-slate-400 leading-relaxed">
                  Setiap penghapusan data dikirim secara *real-time* ke Google Sheets tanpa terhalang proteksi CORS browser.
                </p>
              </div>
            </div>
          </div>

          {/* Modal Add Transaction (Scroll Theme) */}
          {showAddModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="ninja-card rounded-2xl max-w-md w-full p-6 border-2 border-red-900 shadow-2xl relative">
                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                  <h3 className="text-lg font-bold text-white font-cinzel flex items-center gap-2">
                    <i className="fa-solid fa-scroll text-amber-500"></i>
                    <span>Rekam {modalType}</span>
                  </h3>
                  <button 
                    onClick={() => setShowAddModal(false)} 
                    className="text-slate-500 hover:text-red-400"
                  >
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <form onSubmit={handleAddSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Tanggal Tanggal Misi</label>
                    <input 
                      type="date"
                      value={formData.date}
                      onChange={(e) => setFormData({...formData, date: e.target.value})}
                      required
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200 focus:border-red-600"
                    />
                  </div>

                  {modalType !== 'Transfer' ? (
                    <>
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">Kantung Ninja</label>
                        <select 
                          value={formData.wallet}
                          onChange={(e) => setFormData({...formData, wallet: e.target.value})}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200 focus:border-red-600"
                        >
                          {defaultWallets.map(w => <option key={w} value={w}>{w}</option>)}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">Kategori Operational</label>
                        <select 
                          value={formData.category}
                          onChange={(e) => setFormData({...formData, category: e.target.value})}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200 focus:border-red-600"
                        >
                          <option value="Makanan & Minuman">Makanan &amp; Minuman</option>
                          <option value="Transportasi">Transportasi</option>
                          <option value="Belanja">Belanja</option>
                          <option value="Tagihan & Utilitas">Tagihan &amp; Utilitas</option>
                          <option value="Hiburan">Hiburan</option>
                          <option value="Gaji / Pendapatan">Gaji / Pendapatan</option>
                          <option value="Lainnya">Lainnya</option>
                        </select>
                      </div>
                    </>
                  ) : (
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">Dari Kantung</label>
                        <select 
                          value={formData.wallet}
                          onChange={(e) => setFormData({...formData, wallet: e.target.value})}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200 focus:border-amber-600"
                        >
                          {defaultWallets.map(w => <option key={w} value={w}>{w}</option>)}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-400 mb-1">Ke Kantung</label>
                        <select 
                          value={formData.walletTo}
                          onChange={(e) => setFormData({...formData, walletTo: e.target.value})}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200 focus:border-amber-600"
                        >
                          {defaultWallets.map(w => <option key={w} value={w}>{w}</option>)}
                        </select>
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Jumlah Nominal (Rp)</label>
                    <input 
                      type="number"
                      placeholder="0"
                      value={formData.amount}
                      onChange={(e) => setFormData({...formData, amount: e.target.value})}
                      required
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white focus:border-red-600"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-400 mb-1">Catatan Misi</label>
                    <input 
                      type="text"
                      placeholder="Contoh: Ransum beras, senjataku..."
                      value={formData.notes}
                      onChange={(e) => setFormData({...formData, notes: e.target.value})}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm text-slate-200 focus:border-red-600"
                    />
                  </div>

                  <div className="pt-3 flex justify-end space-x-2">
                    <button 
                      type="button" 
                      onClick={() => setShowAddModal(false)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:bg-slate-900"
                    >
                      Batal
                    </button>
                    <button 
                      type="submit"
                      className="px-5 py-2 bg-gradient-to-r from-red-900 to-black hover:from-red-800 border border-red-700 text-white rounded-xl text-xs font-bold uppercase tracking-wider shadow-lg"
                    >
                      Metrai Catatan
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Settings */}
          {showSettings && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="ninja-card rounded-2xl max-w-lg w-full p-6 border border-slate-800 shadow-2xl">
                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                  <h3 className="text-lg font-bold text-white font-cinzel flex items-center gap-2">
                    <i className="fa-solid fa-gear text-amber-500"></i>
                    <span>Integrasi Google Apps Script</span>
                  </h3>
                  <button onClick={() => setShowSettings(false)} className="text-slate-500 hover:text-slate-300">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 mb-1">URL Web App Deployment</label>
                    <input 
                      type="url"
                      placeholder="https://script.google.com/macros/s/.../exec"
                      value={scriptUrl}
                      onChange={(e) => setScriptUrl(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-amber-400 font-mono focus:border-amber-500"
                    />
                    <p className="text-[11px] text-slate-500 mt-1">
                      Tempelkan URL Web App dari menu <b>Deploy &gt; New Deployment</b> di Apps Script.
                    </p>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs space-y-2">
                    <div className="font-bold text-amber-400">⚠️ Syarat Akses Web App:</div>
                    <ul className="list-disc pl-4 space-y-1 text-slate-400">
                      <li><b>Execute as:</b> <code>Me (Email Anda)</code></li>
                      <li><b>Who has access:</b> <code>Anyone (Siapa saja)</code></li>
                    </ul>
                  </div>

                  <div className="flex justify-end pt-2">
                    <button 
                      onClick={() => {
                        setShowSettings(false);
                        showNotification('Pengaturan berhasil disimpan!', 'success');
                      }}
                      className="px-5 py-2 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded-xl text-xs uppercase tracking-wider shadow-md"
                    >
                      Simpan Pengaturan
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
