<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOMPETKU - Financial Tracker & Google Sheets Sync</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f3ff',
              500: '#4f46e5',
              600: '#4338ca',
              700: '#3730a3',
              900: '#0f172a'
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    function App() {
      // Config & State
      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('dompetku_script_url') || '');
      const [showSettings, setShowSettings] = useState(false);
      const [hideBalance, setHideBalance] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [deletingId, setDeletingId] = useState(null);
      const [toast, setToast] = useState(null);

      // Data
      const defaultWallets = ["Tas", "Seabank", "Jok", "Lemari", "BNI", "BRI"];
      const [transactions, setTransactions] = useState(() => {
        const saved = localStorage.getItem('dompetku_txs');
        return saved ? JSON.parse(saved) : [
          { id: 'tx_local_1', date: '2026-09-12', type: 'Pemasukan', wallet: 'Tas', category: 'Makanan & Minuman', amount: 1000000, notes: 'Saldo Awal' },
          { id: 'tx_local_2', date: '2026-09-12', type: 'Pengeluaran', wallet: 'Tas', category: 'Makanan & Minuman', amount: 50000, notes: 'sarapan' }
        ];
      });

      // Filter State
      const [filterWallet, setFilterWallet] = useState('Semua');
      const [filterType, setFilterType] = useState('Semua');
      const [searchQuery, setSearchQuery] = useState('');

      // Form Modal State
      const [showAddModal, setShowAddModal] = useState(false);
      const [modalType, setModalType] = useState('Pengeluaran'); // Pemasukan, Pengeluaran, Transfer
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        wallet: 'Tas',
        walletTo: 'Seabank',
        category: 'Makanan & Minuman',
        amount: '',
        notes: ''
      });

      // Chart Ref
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // Save Local Storage
      useEffect(() => {
        localStorage.setItem('dompetku_txs', JSON.stringify(transactions));
      }, [transactions]);

      useEffect(() => {
        localStorage.setItem('dompetku_script_url', scriptUrl);
      }, [scriptUrl]);

      const showNotification = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Sync from Google Sheets
      const syncFromSheets = async () => {
        if (!scriptUrl) {
          showNotification('⚠️ Masukkan URL Google Apps Script di menu Pengaturan terlebih dahulu!', 'warning');
          setShowSettings(true);
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch(scriptUrl);
          const data = await res.json();
          if (data.status === 'success' && Array.isArray(data.transactions)) {
            setTransactions(data.transactions);
            showNotification('✅ Data berhasil disinkronkan dengan Google Sheets!', 'success');
          } else {
            showNotification('❌ Gagal membaca data: ' + (data.message || 'Format tidak valid'), 'error');
          }
        } catch (err) {
          showNotification('❌ Gagal terhubung ke Google Sheets: ' + err.message, 'error');
        } finally {
          setIsLoading(false);
        }
      };

      // CRITICAL FUNCTION: Delete transaction from Google Sheets without CORS blocking
      const handleDeleteTransaction = async (tx) => {
        if (!confirm(`Apakah Anda yakin ingin menghapus transaksi "${tx.notes || tx.category}" (Rp ${Number(tx.amount).toLocaleString('id-ID')})?`)) {
          return;
        }

        // 1. Hapus sementara di UI lokal
        const previousTxs = [...transactions];
        setTransactions(prev => prev.filter(t => t.id !== tx.id));
        setDeletingId(tx.id);

        if (!scriptUrl) {
          showNotification('Hapus lokal berhasil. (Tambahkan URL Apps Script untuk menghapus di Sheets)', 'info');
          setDeletingId(null);
          return;
        }

        // 2. Kirim request hapus ke Google Apps Script (Menggunakan text/plain untuk bypass CORS)
        try {
          showNotification('⏳ Menghapus transaksi dari Google Sheets...', 'info');
          
          const payload = JSON.stringify({
            action: 'delete',
            id: tx.id,
            date: tx.date,
            type: tx.type,
            wallet: tx.wallet,
            category: tx.category,
            amount: tx.amount,
            notes: tx.notes
          });

          // Menggunakan text/plain mencegah CORS Preflight OPTIONS request yang sering diblokir browser di GAS
          const response = await fetch(scriptUrl, {
            method: 'POST',
            mode: 'cors',
            headers: {
              'Content-Type': 'text/plain;charset=utf-8'
            },
            body: payload
          });

          const result = await response.json();

          if (result.status === 'success') {
            showNotification('✅ Transaksi BERHASIL DIHAPUS dari Google Sheets!', 'success');
          } else {
            // Jika Apps Script gagal menghapus, kembalikan data di UI
            setTransactions(previousTxs);
            showNotification('❌ Gagal hapus di Sheets: ' + result.message, 'error');
          }
        } catch (err) {
          console.error('Delete error:', err);
          // Fallback via GET parameter jika POST diblokir penuh oleh jaringan
          try {
            const queryParams = new URLSearchParams({
              action: 'delete',
              date: tx.date || '',
              type: tx.type || '',
              wallet: tx.wallet || '',
              category: tx.category || '',
              amount: tx.amount || 0,
              notes: tx.notes || ''
            }).toString();

            const fallbackRes = await fetch(`${scriptUrl}?${queryParams}`);
            const fallbackData = await fallbackRes.json();

            if (fallbackData.status === 'success') {
              showNotification('✅ Transaksi BERHASIL DIHAPUS dari Google Sheets!', 'success');
            } else {
              setTransactions(previousTxs);
              showNotification('❌ Gagal menghapus dari Spreadsheet', 'error');
            }
          } catch (fallbackErr) {
            setTransactions(previousTxs);
            showNotification('❌ Koneksi terblokir. Pastikan Akses Web App diset "Anyone / Siapa Saja"', 'error');
          }
        } finally {
          setDeletingId(null);
        }
      };

      const handleAddSubmit = async (e) => {
        e.preventDefault();
        if (!formData.amount || Number(formData.amount) <= 0) {
          showNotification('⚠️ Masukkan nominal yang valid!', 'warning');
          return;
        }

        let walletValue = formData.wallet;
        if (modalType === 'Transfer') {
          walletValue = `${formData.wallet} ➔ ${formData.walletTo}`;
        }

        const newTx = {
          id: 'tx_local_' + Date.now(),
          date: formData.date,
          type: modalType,
          wallet: walletValue,
          category: modalType === 'Transfer' ? 'Transfer Saldo' : formData.category,
          amount: Number(formData.amount),
          notes: formData.notes
        };

        // Update Lokal
        setTransactions(prev => [newTx, ...prev]);
        setShowAddModal(false);

        // Reset form
        setFormData({
          date: new Date().toISOString().split('T')[0],
          wallet: 'Tas',
          walletTo: 'Seabank',
          category: 'Makanan & Minuman',
          amount: '',
          notes: ''
        });

        // Kirim ke Google Sheets
        if (scriptUrl) {
          try {
            showNotification('⏳ Menyimpan ke Google Sheets...', 'info');
            await fetch(scriptUrl, {
              method: 'POST',
              mode: 'cors',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({
                action: 'add',
                ...newTx
              })
            });
            showNotification('✅ Transaksi berhasil disimpan ke Google Sheets!', 'success');
          } catch (err) {
            showNotification('⚠️ Tersimpan lokal, tetapi gagal terhubung ke Sheets', 'warning');
          }
        }
      };

      // Calculate Balances
      const walletBalances = useMemo(() => {
        const balances = {};
        defaultWallets.forEach(w => balances[w] = 0);

        transactions.forEach(tx => {
          const amt = Number(tx.amount) || 0;
          if (tx.type === 'Pemasukan') {
            if (balances[tx.wallet] !== undefined) balances[tx.wallet] += amt;
            else balances[tx.wallet] = amt;
          } else if (tx.type === 'Pengeluaran') {
            if (balances[tx.wallet] !== undefined) balances[tx.wallet] -= amt;
            else balances[tx.wallet] = -amt;
          } else if (tx.type === 'Transfer' && tx.wallet.includes('➔')) {
            const [fromW, toW] = tx.wallet.split('➔').map(s => s.trim());
            if (balances[fromW] !== undefined) balances[fromW] -= amt;
            if (balances[toW] !== undefined) balances[toW] += amt;
          }
        });
        return balances;
      }, [transactions]);

      // Filtered Transactions
      const filteredTransactions = useMemo(() => {
        return transactions.filter(tx => {
          const matchWallet = filterWallet === 'Semua' || tx.wallet.includes(filterWallet);
          const matchType = filterType === 'Semua' || tx.type === filterType;
          const query = searchQuery.toLowerCase();
          const matchSearch = !query || 
            (tx.notes && tx.notes.toLowerCase().includes(query)) ||
            (tx.category && tx.category.toLowerCase().includes(query)) ||
            (tx.wallet && tx.wallet.toLowerCase().includes(query));

          return matchWallet && matchType && matchSearch;
        });
      }, [transactions, filterWallet, filterType, searchQuery]);

      // Chart Rendering
      useEffect(() => {
        if (!chartRef.current) return;

        const categoryTotals = {};
        transactions.forEach(tx => {
          if (tx.type === 'Pengeluaran') {
            const cat = tx.category || 'Lainnya';
            categoryTotals[cat] = (categoryTotals[cat] || 0) + Number(tx.amount);
          }
        });

        const labels = Object.keys(categoryTotals);
        const data = Object.values(categoryTotals);

        if (chartInstance.current) {
          chartInstance.current.destroy();
        }

        const ctx = chartRef.current.getContext('2d');
        chartInstance.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels.length ? labels : ['Belum Ada Pengeluaran'],
            datasets: [{
              data: data.length ? data : [1],
              backgroundColor: data.length ? [
                '#f87171', '#fb923c', '#fbbf24', '#a3e635', '#34d399', '#22d3ee', '#818cf8', '#c084fc'
              ] : ['#e2e8f0']
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { position: 'bottom' }
            }
          }
        });

        return () => {
          if (chartInstance.current) chartInstance.current.destroy();
        };
      }, [transactions]);

      return (
        <div className="max-w-7xl mx-auto px-4 py-6">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-5 py-3 rounded-xl shadow-2xl text-white font-medium flex items-center space-x-3 transition-all transform slide-in ${
              toast.type === 'error' ? 'bg-red-600' :
              toast.type === 'warning' ? 'bg-amber-600' :
              toast.type === 'success' ? 'bg-emerald-600' : 'bg-slate-800'
            }`}>
              <span>{toast.msg}</span>
            </div>
          )}

          {/* Header */}
          <header className="bg-slate-900 text-white rounded-2xl p-5 shadow-lg mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div className="flex items-center space-x-3">
              <div className="w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center text-2xl shadow-inner">
                <i className="fa-solid fa-wallet"></i>
              </div>
              <div>
                <h1 className="text-2xl font-bold tracking-tight">DOMPETKU</h1>
                <p className="text-xs text-slate-400">Pencatatan Keuangan Multi-Device & Google Sheets Sync</p>
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-2">
              <button 
                onClick={syncFromSheets}
                disabled={isLoading}
                className="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center space-x-2 transition shadow-sm disabled:opacity-50"
              >
                <i className={`fa-solid fa-rotate ${isLoading ? 'animate-spin' : ''}`}></i>
                <span>{isLoading ? 'Menyinkronkan...' : 'Tersinkron Sheets'}</span>
              </button>

              <button 
                onClick={() => setHideBalance(!hideBalance)}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-sm font-medium transition"
              >
                <i className={`fa-solid ${hideBalance ? 'fa-eye-slash' : 'fa-eye'} mr-1.5`}></i>
                {hideBalance ? 'Tampilkan Saldo' : 'Sembunyikan Saldo'}
              </button>

              <button 
                onClick={() => setShowSettings(true)}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 p-2.5 rounded-xl text-sm transition"
                title="Pengaturan Integrasi"
              >
                <i className="fa-solid fa-gear text-lg"></i>
              </button>
            </div>
          </header>

          {}
          {/* Wallet Balance Cards */}
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
            {defaultWallets.map((w, idx) => {
              const bal = walletBalances[w] || 0;
              const bgColors = [
                'from-orange-500 to-amber-600',
                'from-teal-600 to-emerald-700',
                'from-purple-600 to-indigo-700',
                'from-emerald-600 to-teal-700',
                'from-red-600 to-rose-700',
                'from-blue-600 to-indigo-700'
              ];
              return (
                <div key={w} className={`bg-gradient-to-br ${bgColors[idx % bgColors.length]} text-white p-4 rounded-2xl shadow-md flex flex-col justify-between`}>
                  <span className="text-xs font-medium text-white/80">Saldo Saat Ini</span>
                  <div className="mt-2">
                    <div className="text-xs font-bold uppercase tracking-wider text-white/90">{w}</div>
                    <div className="text-lg font-bold truncate">
                      {hideBalance ? 'Rp •••••••' : `Rp ${bal.toLocaleString('id-ID')}`}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Main Grid Section */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Left Column: Transaction History */}
            <div className="lg:col-span-2 bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80">
              <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-5">
                <div>
                  <h2 className="text-lg font-bold text-slate-900">
                    Riwayat Transaksi 
                    <span className="ml-2 text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full font-medium">
                      {filteredTransactions.length} Transaksi
                    </span>
                  </h2>
                </div>

                {/* Add Transaction Buttons */}
                <div className="flex flex-wrap gap-2">
                  <button 
                    onClick={() => { setModalType('Pengeluaran'); setShowAddModal(true); }}
                    className="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1"
                  >
                    <i className="fa-solid fa-minus-circle"></i>
                    <span>Pengeluaran</span>
                  </button>

                  <button 
                    onClick={() => { setModalType('Pemasukan'); setShowAddModal(true); }}
                    className="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1"
                  >
                    <i className="fa-solid fa-plus-circle"></i>
                    <span>Pemasukan</span>
                  </button>

                  <button 
                    onClick={() => { setModalType('Transfer'); setShowAddModal(true); }}
                    className="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1"
                  >
                    <i className="fa-solid fa-arrow-right-arrow-left"></i>
                    <span>Transfer</span>
                  </button>
                </div>
              </div>

              {}
              {/* Filter Controls */}
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4">
                <select 
                  value={filterWallet} 
                  onChange={(e) => setFilterWallet(e.target.value)}
                  className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                  <option value="Semua">Semua Dompet</option>
                  {defaultWallets.map(w => <option key={w} value={w}>{w}</option>)}
                </select>

                <select 
                  value={filterType} 
                  onChange={(e) => setFilterType(e.target.value)}
                  className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                >
                  <option value="Semua">Semua Tipe Transaksi</option>
                  <option value="Pemasukan">Pemasukan</option>
                  <option value="Pengeluaran">Pengeluaran</option>
                  <option value="Transfer">Transfer</option>
                </select>

                <input 
                  type="text"
                  placeholder="Cari keterangan / kategori..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  className="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                />
              </div>

              {}
              {/* Transactions Table */}
              <div className="overflow-x-auto rounded-xl border border-slate-100">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-50 text-slate-500 font-semibold text-xs uppercase tracking-wider">
                    <tr>
                      <th className="p-3">Tanggal</th>
                      <th className="p-3">Tipe</th>
                      <th className="p-3">Dompet</th>
                      <th className="p-3">Kategori & Catatan</th>
                      <th className="p-3 text-right">Jumlah (Rp)</th>
                      <th className="p-3 text-center">Aksi</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {filteredTransactions.length === 0 ? (
                      <tr>
                        <td colSpan="6" className="text-center py-8 text-slate-400">
                          <i className="fa-regular fa-folder-open text-3xl mb-2 block"></i>
                          Tidak ada transaksi yang ditemukan.
                        </td>
                      </tr>
                    ) : (
                      filteredTransactions.map((tx) => (
                        <tr key={tx.id} className="hover:bg-slate-50/80 transition">
                          <td className="p-3 font-mono text-xs text-slate-500 whitespace-nowrap">{tx.date}</td>
                          <td className="p-3">
                            <span className={`inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold ${
                              tx.type === 'Pemasukan' ? 'bg-emerald-100 text-emerald-700' :
                              tx.type === 'Pengeluaran' ? 'bg-rose-100 text-rose-700' :
                              'bg-indigo-100 text-indigo-700'
                            }`}>
                              {tx.type}
                            </span>
                          </td>
                          <td className="p-3 font-medium text-slate-700">{tx.wallet}</td>
                          <td className="p-3">
                            <div className="font-medium text-slate-800">{tx.category || '-'}</div>
                            {tx.notes && <div className="text-xs text-slate-400">{tx.notes}</div>}
                          </td>
                          <td className={`p-3 text-right font-bold whitespace-nowrap ${
                            tx.type === 'Pemasukan' ? 'text-emerald-600' :
                            tx.type === 'Pengeluaran' ? 'text-rose-600' :
                            'text-indigo-600'
                          }`}>
                            {tx.type === 'Pemasukan' ? '+ ' : tx.type === 'Pengeluaran' ? '- ' : ''}
                            Rp {Number(tx.amount).toLocaleString('id-ID')}
                          </td>
                          <td className="p-3 text-center">
                            <button 
                              onClick={() => handleDeleteTransaction(tx)}
                              disabled={deletingId === tx.id}
                              className="text-slate-400 hover:text-rose-600 p-2 rounded-lg transition disabled:opacity-30"
                              title="Hapus Transaksi (Terhapus dari Google Sheets)"
                            >
                              <i className={`fa-solid ${deletingId === tx.id ? 'fa-spinner animate-spin text-rose-600' : 'fa-trash-can'}`}></i>
                            </button>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
            </div>

            {}
            {/* Right Column: Analytics Chart */}
            <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200/80 flex flex-col justify-between">
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-slate-900">Pengeluaran per Kategori</h3>
                  <span className="text-xs text-slate-400">Bulan Ini</span>
                </div>
                <div className="relative h-64 w-full">
                  <canvas ref={chartRef}></canvas>
                </div>
              </div>

              <div className="mt-6 p-4 bg-indigo-50 rounded-xl border border-indigo-100 text-xs text-indigo-900">
                <i className="fa-solid fa-shield-halved text-indigo-600 text-sm mr-2"></i>
                <b>Garansi Sinkronisasi:</b> Setiap aksi hapus pada aplikasi web ini dikirim langsung secara *real-time* ke Google Sheets Anda tanpa kendala pemblokiran CORS.
              </div>
            </div>
          </div>

          {}
          {/* Modal Add Transaction */}
          {showAddModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl animate-fade-in">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-slate-900">Tambah {modalType}</h3>
                  <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <form onSubmit={handleAddSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Tanggal</label>
                    <input 
                      type="date"
                      value={formData.date}
                      onChange={(e) => setFormData({...formData, date: e.target.value})}
                      required
                      className="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  {modalType !== 'Transfer' ? (
                    <>
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">Dompet</label>
                        <select 
                          value={formData.wallet}
                          onChange={(e) => setFormData({...formData, wallet: e.target.value})}
                          className="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500"
                        >
                          {defaultWallets.map(w => <option key={w} value={w}>{w}</option>)}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">Kategori</label>
                        <select 
                          value={formData.category}
                          onChange={(e) => setFormData({...formData, category: e.target.value})}
                          className="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500"
                        >
                          <option value="Makanan & Minuman">Makanan & Minuman</option>
                          <option value="Transportasi">Transportasi</option>
                          <option value="Belanja">Belanja</option>
                          <option value="Tagihan & Utilitas">Tagihan & Utilitas</option>
                          <option value="Hiburan">Hiburan</option>
                          <option value="Gaji / Pendapatan">Gaji / Pendapatan</option>
                          <option value="Lainnya">Lainnya</option>
                        </select>
                      </div>
                    </>
                  ) : (
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">Dari Dompet</label>
                        <select 
                          value={formData.wallet}
                          onChange={(e) => setFormData({...formData, wallet: e.target.value})}
                          className="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500"
                        >
                          {defaultWallets.map(w => <option key={w} value={w}>{w}</option>)}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-600 mb-1">Ke Dompet</label>
                        <select 
                          value={formData.walletTo}
                          onChange={(e) => setFormData({...formData, walletTo: e.target.value})}
                          className="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500"
                        >
                          {defaultWallets.map(w => <option key={w} value={w}>{w}</option>)}
                        </select>
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Jumlah (Rp)</label>
                    <input 
                      type="number"
                      placeholder="0"
                      value={formData.amount}
                      onChange={(e) => setFormData({...formData, amount: e.target.value})}
                      required
                      className="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 mb-1">Keterangan / Catatan</label>
                    <input 
                      type="text"
                      placeholder="Contoh: Sarapan pagi, bayar listrik..."
                      value={formData.notes}
                      onChange={(e) => setFormData({...formData, notes: e.target.value})}
                      className="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500"
                    />
                  </div>

                  <div className="pt-2 flex justify-end space-x-2">
                    <button 
                      type="button" 
                      onClick={() => setShowAddModal(false)}
                      className="px-4 py-2 rounded-xl text-sm font-semibold text-slate-500 hover:bg-slate-100"
                    >
                      Batal
                    </button>
                    <button 
                      type="submit"
                      className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-md"
                    >
                      Simpan Transaksi
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal Settings */}
          {showSettings && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-lg font-bold text-slate-900">Pengaturan Google Apps Script</h3>
                  <button onClick={() => setShowSettings(false)} className="text-slate-400 hover:text-slate-600">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">URL Web App Google Apps Script</label>
                    <input 
                      type="url"
                      placeholder="https://script.google.com/macros/s/.../exec"
                      value={scriptUrl}
                      onChange={(e) => setScriptUrl(e.target.value)}
                      className="w-full border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 font-mono text-xs"
                    />
                    <p className="text-xs text-slate-400 mt-1">
                      Tempelkan URL Web App yang didapat setelah memilih menu <b>Deploy &gt; New Deployment</b> di Apps Script.
                    </p>
                  </div>

                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs space-y-2">
                    <div className="font-bold text-slate-800">⚠️ Catatan Pengaturan Deployment GAS:</div>
                    <ul className="list-disc pl-4 space-y-1 text-slate-600">
                      <li><b>Execute as:</b> <code>Me (Email Anda)</code></li>
                      <li><b>Who has access:</b> <code>Anyone (Siapa saja)</code> — Mandatory!</li>
                    </ul>
                  </div>

                  <div className="flex justify-end pt-2">
                    <button 
                      onClick={() => {
                        setShowSettings(false);
                        showNotification('Pengaturan berhasil disimpan!', 'success');
                      }}
                      className="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-semibold shadow-md"
                    >
                      Selesai &amp; Simpan
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
